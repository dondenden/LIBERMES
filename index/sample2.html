<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>
    sanmple2
  </title>
  <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    canvas {
      display: block;
    }
  </style>
  <script type="module">
    import * as THREE from "three/webgpu"
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const height = window.innerHeight;
    const width = window.innerWidth;

    const renderer = new THREE.WebGPURenderer({
      canvas: document.querySelector("#myCanvas")
    });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(width,height);

    renderer.setAnimationLoop(tick);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(45, width/height);
    camera.position.set(0,0, +1000);

    const controls = new OrbitControls(camera,renderer.domElemnt);

    window.addEventListener("resize", () =>{
      const height = window.innerHeight;
      const width = window.innerWidth;

      renderer.setSize(width,height);
      camera.aspect = width/height;
      camera.updateProjectionMatrix();
    })

    const mesh = new THREE.Mesh(new THREE.BoxGeometry(400,400,400),new THREE.MeshNormalMaterial());
    scene.add(mesh);

    function tick(){
      renderer.render(scene,camera);
    }

    console.log("load complete")
  </script>
</head>

<body>
  <canvas id="myCanvas"></canvas>
</body>

</html>
